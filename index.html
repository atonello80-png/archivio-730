<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145e50"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Archivio 730</title><style> *{box-sizing:border-box}body{font:16px system-ui;background:#f2f4f5;color:#182d29;margin:auto;max-width:650px;padding:20px}h1{margin-bottom:4px}section{background:white;border-radius:18px;padding:18px;margin:14px 0}button,input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccd6d3;max-width:100%}button{background:#145e50;color:white;border:0;cursor:pointer;margin:4px 0}label{display:block;margin:12px 0 4px}input:not([type=file]),select{width:100%}small{color:#52645e}article{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}.total{background:#145e50;color:white}.total small{color:#dceee7}#preview img{max-width:100%;max-height:300px} </style><h1>Archivio 730</h1><small>Archivio fiscale personale · dati sul dispositivo</small><section class="total"><label for="year">Anno delle spese</label><select id="year"></select><h2 id="total">€ 0,00</h2><small id="count"></small></section><section><h2>Nuovo documento</h2><button id="camera">Fotografa scontrino</button> <button id="import">Importa file o foto</button><input id="cam" type="file" accept="image/*" capture="environment" hidden><input id="files" type="file" accept="image/*,application/pdf" multiple hidden><div id="preview"></div><form id="form"><label>Categoria</label><select id="category"></select><label>Data del documento</label><input id="date" type="date" required><label>Descrizione</label><input id="name" placeholder="Es. Scontrino farmacia" required><label>Importo totale (€)</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Facoltativo"><button type="submit">Salva nell’archivio</button></form><p id="status" role="status"></p></section><section><h2>Documenti</h2><select id="filter"></select><input id="search" placeholder="Cerca descrizione"><div id="list"></div><button id="csv">Esporta riepilogo CSV</button><button id="backup">Esporta backup completo</button><button id="restore">Importa backup</button><input id="backupfile" type="file" accept="application/json" hidden><p><small>I file restano nel browser. Esporta regolarmente un backup in File/iCloud: la cancellazione dei dati del sito può eliminare l’archivio. Gli importi non sono una verifica di detraibilità.</small></p></section><script>
const $=id=>document.getElementById(id), cats=['Farmacia','Visite mediche','Dentista','Assicurazioni','Altri documenti'];let pending=[],db,docs=[];const money=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$('date').value=today();for(let y=2020;y<=new Date().getFullYear()+2;y++)$('year').add(new Option(y,y));$('year').value=new Date().getFullYear();cats.forEach(c=>$('category').add(new Option(c,c)));$('filter').add(new Option('Tutte le categorie',''));cats.forEach(c=>$('filter').add(new Option(c,c)));const req=indexedDB.open('archivio730',1);req.onupgradeneeded=()=>req.result.createObjectStore('docs',{keyPath:'id'});req.onsuccess=()=>{db=req.result;refresh()};req.onerror=()=>alert('Archivio locale non disponibile');function store(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction('docs',mode);fn(t.objectStore('docs'));t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}function refresh(){const r=db.transaction('docs').objectStore('docs').getAll();r.onsuccess=()=>{docs=r.result;render()}}function selected(){return docs.filter(d=>d.date.slice(0,4)===$('year').value)}function render(){let a=selected();$('total').textContent=money(a.reduce((s,d)=>s+(d.amount||0),0));$('count').textContent=a.length+' documenti';$('list').replaceChildren();a.filter(d=>(!$('filter').value||d.category===$('filter').value)&&d.name.toLowerCase().includes($('search').value.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date)).forEach(d=>{let el=document.createElement('article'),p=document.createElement('p');p.textContent=`${d.name} · ${d.category} · ${d.date} · ${d.amount===null?'Importo non indicato':money(d.amount)}`;el.append(p);for(const [label,fn] of [['Apri / salva',()=>download(d.blob,d.filename)],['Condividi',()=>share(d)],['Elimina',async()=>{if(confirm('Eliminare questo documento?')){await store('readwrite',s=>s.delete(d.id));refresh()}}]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;el.append(b,document.createTextNode(' '))}$('list').append(el)})}['year','filter','search'].forEach(id=>$(id).oninput=render);$('camera').onclick=()=>$('cam').click();$('import').onclick=()=>$('files').click();function pick(e){pending=Array.from(e.target.files);$('preview').textContent=pending.map(f=>f.name).join(', ');if(pending.length)$('name').value=pending[0].name.replace(/\.[^.]+$/,'');e.target.value=''}$('cam').onchange=pick;$('files').onchange=pick;
// Convert photos to a single-page PDF locally, without external libraries.
async function photoPDF(file){let img=new Image(),url=URL.createObjectURL(file);try{img.src=url;await img.decode();let scale=Math.min(1,2200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let jpeg=new Uint8Array(await (await new Promise(r=>c.toBlob(r,'image/jpeg',.88))).arrayBuffer());let w=595,h=Math.round(w*c.height/c.width),enc=new TextEncoder(),parts=[],offsets=[0],pos=0;function add(x){let b=typeof x==='string'?enc.encode(x):x;parts.push(b);pos+=b.length}function obj(n,x){offsets[n]=pos;add(n+' 0 obj\n');add(x);add('\nendobj\n')}add('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);offsets[4]=pos;add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);add(jpeg);add('\nendstream\nendobj\n');let cmd=`q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q\n`;obj(5,`<< /Length ${enc.encode(cmd).length} >>\nstream\n${cmd}endstream`);let start=pos;add('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}finally{URL.revokeObjectURL(url)}}
$('form').onsubmit=async e=>{e.preventDefault();if(!pending.length)return $('status').textContent='Seleziona un file prima di salvare.';let btn=e.submitter;btn.disabled=true;try{let records=[];for(let f of pending){let blob=f.type==='application/pdf'||/\.pdf$/i.test(f.name)?new Blob([f],{type:'application/pdf'}):await photoPDF(f);let name=pending.length===1?$('name').value:f.name.replace(/\.[^.]+$/,'');records.push({id:crypto.randomUUID(),name,date:$('date').value,category:$('category').value,amount:pending.length===1&&$('amount').value!==''?Number($('amount').value):null,filename:($('date').value+'_'+$('category').value+'_'+name).replace(/[^\p{L}\p{N}_.-]/gu,'_')+'.pdf',blob})}await store('readwrite',s=>records.forEach(d=>s.put(d)));$('year').value=$('date').value.slice(0,4);pending=[];$('preview').textContent='';$('name').value='';$('amount').value='';$('status').textContent='Salvato. '+(records.length>1?'Importi non assegnati ai file multipli.':'');refresh()}catch(e){$('status').textContent='Errore: '+e.message}finally{btn.disabled=false}};function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}async function share(d){let f=new File([d.blob],d.filename,{type:'application/pdf'});try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]});else download(d.blob,d.filename)}catch(e){if(e.name!=='AbortError')alert(e.message)}}$('csv').onclick=()=>{let quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download(new Blob(['\ufeffData;Categoria;Descrizione;Importo\n'+selected().map(d=>[d.date,d.category,d.name.replace(/^[=+@-]/,"'$&"),d.amount===null?'':d.amount.toFixed(2).replace('.',',')].map(quote).join(';')).join('\n')],{type:'text/csv'}),'730_'+$('year').value+'.csv')};function dataURL(b){return new Promise((r,j)=>{let f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b)})}$('backup').onclick=async()=>{try{let a=await Promise.all(docs.map(async d=>({...d,blob:await dataURL(d.blob)})));download(new Blob([JSON.stringify({version:1,docs:a})],{type:'application/json'}),'Archivio730_backup_'+today()+'.json')}catch(e){alert(e.message)}};$('restore').onclick=()=>$('backupfile').click();$('backupfile').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(a.version!==1||!Array.isArray(a.docs))throw Error('Backup non valido');let items=[];for(let d of a.docs){if(typeof d.id!=='string'||typeof d.name!=='string'||!cats.includes(d.category)||!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||typeof d.filename!=='string'||!/^data:application\/pdf;base64,/.test(d.blob)||!(d.amount===null||typeof d.amount==='number'))throw Error('Documento non valido');let raw=atob(d.blob.split(',')[1]);items.push({...d,blob:new Blob([Uint8Array.from(raw,c=>c.charCodeAt(0))],{type:'application/pdf'})})}if(confirm('Importare '+items.length+' documenti? Gli ID uguali verranno aggiornati.')){await store('readwrite',s=>items.forEach(d=>s.put(d)));refresh()}}catch(e){alert(e.message)}finally{e.target.value=''}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
